<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}{% endblock %}</title>
<style>
  :root {
    color-scheme: light;
    --fondo: #f4f3ef;
    --superficie: #fcfcfb;
    --texto: #0b0b0b;
    --texto-suave: #52514e;
    --borde: #e4e3df;
    --acento: #2a78d6;
    --aviso-fondo: #fdf3dc;
    --aviso-borde: #eda100;
    --error: #d03b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 0 0 12px; }
  .meta { color: var(--texto-suave); font-size: 0.9rem; margin: 0 0 24px; }
  .meta code { background: var(--borde); padding: 1px 6px; border-radius: 4px; word-break: break-all; }
  section {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .indicadores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .indicador {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 16px;
  }
  .indicador .etiqueta { color: var(--texto-suave); font-size: 0.85rem; }
  .indicador .valor { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .indicador .nota { color: var(--texto-suave); font-size: 0.8rem; }
  img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--borde); text-align: left; }
  th { color: var(--texto-suave); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--acento); font-size: 0.9rem; }
  details table { margin-top: 8px; }
  .aviso {
    background: var(--aviso-fondo);
    border-left: 4px solid var(--aviso-borde);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }
  .error { color: var(--error); font-weight: 600; }
  a { color: var(--acento); }
  footer { color: var(--texto-suave); font-size: 0.8rem; text-align: center; margin-top: 24px; }
  @media (max-width: 720px) {
    .indicadores { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .indicador { padding: 12px; min-width: 0; }
    .indicador .valor { font-size: 1.1rem; overflow-wrap: anywhere; }
    section { padding: 14px; }
    .tabla-ancha { overflow-x: auto; }
  }
  @media print {
    body { background: #fff; }
    section, .indicador { break-inside: avoid; }
    details > *:not(summary) { display: block; }
  }
</style>
</head>
<body>
<main>
{% block contenido %}{% endblock %}
<footer>Generado automáticamente con automatizacion-python · {{ fecha_ejecucion }}</footer>
</main>
</body>
</html>
